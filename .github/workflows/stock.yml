name: Manhattan iPhone stock
on:
  schedule:
    # Five minutes is GitHub's minimum. Offset from :00 to reduce peak-hour contention.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a phone test notification
        type: boolean
        default: false
      probe_only:
        description: Check live inventory without alerts
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: iphone-stock-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore last observation
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .monitor-state
          key: iphone-stock-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: iphone-stock-v1-
      - name: Run checker
        id: monitor
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_ALERT: ${{ inputs.test_alert }}
          PROBE_ONLY: ${{ inputs.probe_only }}
        run: |
          if [ "$TEST_ALERT" = "true" ]; then
            python monitor.py --test-alert
          elif [ "$PROBE_ONLY" = "true" ]; then
            python monitor.py --probe
          else
            python monitor.py
          fi
      - name: Save state even after inventory failure
        if: ${{ always() && inputs.test_alert != true && inputs.probe_only != true && hashFiles('.monitor-state/state.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .monitor-state
          key: iphone-stock-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Mark failed checks visibly
        if: steps.monitor.outcome == 'failure'
        run: exit 1
