name: Manhattan iPhone stock
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stock.yml'
      - 'monitor.py'
  schedule:
    # Five minutes is GitHub's minimum. Offset from :00 to reduce peak-hour contention.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      probe_only:
        description: Check live inventory without alerts
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: iphone-stock-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore last observation
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .monitor-state
          key: iphone-stock-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: iphone-stock-v1-
      - name: Check inventory every five minutes for 90 minutes
        id: monitor
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTIFY_LOGIN: v28mz9d29s-blip
          PROBE_ONLY: ${{ inputs.probe_only }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "$PROBE_ONLY" = "true" ]; then
            python monitor.py --probe
          else
            # Keep polling inside the runner: scheduled events can be delayed/dropped.
            # One active run and one queued successor share the concurrency group.
            failed=0
            for attempt in {1..19}; do
              started=$SECONDS
              echo "Inventory check $attempt/19"
              python monitor.py || failed=1
              if [ "$attempt" -lt 19 ]; then
                remaining=$((300 - (SECONDS - started)))
                if [ "$remaining" -gt 0 ]; then sleep "$remaining"; fi
              fi
            done
            exit "$failed"
          fi
      - name: Save state even after inventory failure
        if: ${{ always() && inputs.probe_only != true && hashFiles('.monitor-state/state.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .monitor-state
          key: iphone-stock-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Mark failed checks visibly
        if: steps.monitor.outcome == 'failure'
        run: exit 1
